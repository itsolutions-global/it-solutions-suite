name: CI & Multi-Arch Docker Publish

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # 1. Automated Test Suite & Security Boundary Verification
  # ============================================================================
  test-suite:
    name: Verify Zero-Defect Test Suites & Air-Gap Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Runtime (Zero-Dependency Stdlib)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Strict NexusBridge Air-Gap Exclusion Verification
        run: |
          echo "Verifying 100% exclusion of private NexusBridge subsystem..."
          TRACKED_FILES=$(git ls-files products/nexusbridge | wc -l)
          if [ "$TRACKED_FILES" -ne 0 ]; then
            echo "CRITICAL SECURITY VIOLATION: products/nexusbridge has $TRACKED_FILES tracked files in Git!"
            exit 1
          fi
          echo "[OK] NexusBridge is 100% excluded and untracked in version control."

      - name: Run CorePulse Unit Tests
        run: |
          python -m unittest discover -s products/corepulse/tests -p "test_*.py" -v

      - name: Run EchoStream Unit Tests
        run: |
          python -m unittest discover -s products/echostream/tests -p "test_*.py" -v

      - name: Run NexusShield SAST & Security Tests
        run: |
          python -m unittest discover -s products/nexusshield/tests -p "test_*.py" -v

      - name: Verify Corporate Health Telemetry
        run: |
          python products/corepulse/main.py &
          SERVER_PID=$!
          sleep 3
          python company/health_monitor.py --once
          kill $SERVER_PID || true

  # ============================================================================
  # 2. Multi-Arch Production Docker Image Build & Push to Docker Hub
  # ============================================================================
  docker-build-push:
    name: Build & Push Multi-Arch Image (linux/amd64, linux/arm64)
    needs: test-suite
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU Multi-Arch Emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        if: env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'itsolutionsglobal' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Multi-Arch Container Image
        uses: docker/build-push-action@v6
        with:
          context: ./products/corepulse
          file: ./products/corepulse/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_TOKEN != '' }}
          tags: |
            itsolutionsglobal/corepulse:latest
            itsolutionsglobal/corepulse:1.0.0
            itsolutionsglobal/corepulse:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
