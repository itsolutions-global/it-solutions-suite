[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "it-solutions-suite"
version = "1.1.0"
description = "100% Local-First Zero-Dependency Python & Browser Suite: CorePulse, NexusShield (SAST & CycloneDX v1.5 SBOM), EchoStream, DocuPulse & ClauseGuard"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "IT Solutions Global Corporation", email = "isgc@sedain.com" }
]
keywords = [
    "productivity",
    "executive-cockpit",
    "security-scanner",
    "sast",
    "sbom",
    "cyclonedx",
    "contract-scanner",
    "invoice-extractor",
    "speech-perception",
    "dlp",
    "omnibar",
    "workflow-automation"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Office/Business",
    "Operating System :: OS Independent"
]
dependencies = []

[project.scripts]
it-solutions = "products.cli:main"

[project.urls]
Homepage = "https://itsolutions-global.vercel.app"
Repository = "https://github.com/itsolutions-global/it-solutions-suite"
Issues = "https://github.com/itsolutions-global/it-solutions-suite/issues"
Commercial_Licensing = "https://itsolutions-global.vercel.app/solutions"

[tool.setuptools.packages.find]
where = ["."]
include = ["products*"]
exclude = ["products.nexusbridge*", "products.nexusbridge"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.json", "*.md", "*.svg", "*.ico", "*.txt"]
